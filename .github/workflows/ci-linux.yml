name: Linux

# The build against an environment installed on the runner by INSPECTA-models'
# provers-env/provers-setup.sh, rather than one baked into a container.  The
# container is still exercised, by ci-docker.yml, which runs the same build.
#
# This is the workflow that owns the repository update: it is handed branch_name,
# and bin/build.cmd pushes what change detection finds to that branch.  No other
# workflow is given it, so no other one pushes.
on:
   workflow_call:
     inputs:
       branch_name:
         required: true
         type: string

jobs:
  ci:
    # provers-setup.sh supports Ubuntu 24.04 and macOS on Apple Silicon; pinned
    # rather than ubuntu-latest so that moving the label to a newer Ubuntu is a
    # decision taken here rather than one that arrives on its own.
    runs-on: ubuntu-24.04
    name: HAMR-codegen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: sireum/kekinian
          path: kekinian
          submodules: recursive
      - name: Checkout provers-env
        uses: actions/checkout@v4
        with:
          repository: loonwerks/INSPECTA-models
          path: INSPECTA-models
          # provers-env is all this needs; the models themselves are the bulk of
          # that repository and nothing here reads them.
          sparse-checkout: provers-env
      - name: Cache Java
        id: cache-java
        uses: actions/cache@v4
        with:
          path: kekinian/bin/linux/java
          key: ${{ runner.os }}-${{ hashFiles('kekinian/versions.properties') }}-java
      - name: Cache Scala
        id: cache-scala
        uses: actions/cache@v4
        with:
          path: kekinian/bin/scala
          key: ${{ runner.os }}-${{ hashFiles('kekinian/versions.properties') }}-scala
      - name: Cache Coursier
        id: cache-coursier
        uses: actions/cache@v4
        with:
          path: cache/coursier
          key: ${{ runner.os }}-${{ hashFiles('kekinian/versions.properties') }}-coursier
      - name: Cache SMT2 solvers
        id: cache-smt2
        uses: actions/cache@v4
        with:
          path: |
            kekinian/bin/linux/cvc
            kekinian/bin/linux/.cvc.ver
            kekinian/bin/linux/cvc5
            kekinian/bin/linux/.cvc5.ver
            kekinian/bin/linux/z3
          key: ${{ runner.os }}-${{ hashFiles('kekinian/versions.properties') }}-smt2
      - name: Cache FMIDE
        id: cache-fmide
        uses: actions/cache@v4
        with:
          path: kekinian/bin/linux/fmide
          key: ${{ runner.os }}-${{ hashFiles('kekinian/bin/install/fmide*') }}-fmide
      - name: Install the PROVERS environment
        run: |
          # provers-env adopts an existing Sireum rather than installing the one
          # it pins: bin/sireum.sh sees SIREUM_HOME already set and leaves that
          # tree alone, so Verus, the Microkit SDK, LionsOS and sdfgen are
          # installed around the kekinian checked out above -- which is the
          # Sireum this build is meant to test -- and the Test step below is what
          # bootstraps it.
          export SIREUM_HOME=$GITHUB_WORKSPACE/kekinian
          bash INSPECTA-models/provers-env/provers-setup.sh
      - name: Test
        run: |
          export COURSIER_CACHE=$GITHUB_WORKSPACE/cache/coursier

          # see https://github.com/sireum/osate-plugin/blob/57785407d84793cf1f8d5926647e4dc75ab197a9/org.sireum.aadl.osate.cli/src/org/sireum/aadl/osate/cli/Phantom.java#L508-L517
          export CHECK_PHANTOM_HAMR_API_COMPATIBILITY=true

          # note: workflows have to have read and write permissions if the workflow pushes changes
          #       back to the repo.
          #       Settings >> General >> Actions >> General >> Workflow permissions

          git config user.name github-actions
          git config user.email github-actions@github.com

          export branch_name=${{ inputs.branch_name }}

          # provers-setup.sh wires the environment into the shell startup file,
          # which the non-interactive shell a workflow step runs in never reads,
          # so it is sourced here instead.  SIREUM_HOME is exported first for the
          # same reason as in the step above: env.sh keeps the one it is given
          # and would otherwise name ${PROVERS_DIR}/Sireum.  It is env.sh that
          # supplies MICROKIT_SDK, MICROKIT_BOARD and LIONSOS, which bin/build.cmd
          # and the generated makefiles require, and that puts Verus, Sireum and
          # sdfgen on PATH.
          export SIREUM_HOME=$GITHUB_WORKSPACE/kekinian
          export PROVERS_BIN_DIR=$GITHUB_WORKSPACE/INSPECTA-models/provers-env/bin
          . ${PROVERS_BIN_DIR}/env.sh

          ${SIREUM_HOME}/bin/build.cmd setup
          rm -rf ${SIREUM_HOME}/.git
          rm -rf ${SIREUM_HOME}/out

          sireum -v

          ${SIREUM_HOME}/bin/install/fmide.cmd -v

          git clone --depth 1 https://github.com/santoslab/sysml-aadl-libraries.git sysml-aadl-libraries
          # Remove .git to save space and to prevent actions/checkout post-job
          # cleanup from mistaking this for a submodule (which causes a fatal
          # error since there is no .gitmodules entry for it)
          rm -rf sysml-aadl-libraries/.git
          export SYSML_AADL_LIBRARIES=$(pwd)/sysml-aadl-libraries

          bin/build.cmd
